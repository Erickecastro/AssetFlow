services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: assetflow
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: assetflow_dev
    ports:
      - "5432:5432"
    volumes:
      - assetflow-postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetflow -d assetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  assetflow-postgres18-data:
